[package]
name = "aevaleron"
version = "1.1.1"
description = "Screen-aware AI overlay for Windows"
authors = ["darkelights"]
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
name = "aevaleron_lib"
crate-type = ["rlib"]

[build-dependencies]
# The .slint files compile to Rust; winresource embeds the icon and version
# info tauri-build used to.
slint-build = "1.19"
winresource = "0.1"

# Dependencies are grouped by the lane whose code needs them
# (.claude/rust-rewrite/BACKLOG.md, "Hotspots"). A lane adds a dependency, or
# a feature to the windows / windows-sys arrays below, only inside its own
# block. Crates every lane uses sit in the platform block; ask platform to
# change those.
[dependencies]
# ---- lane: platform ----
# Native UI (lane native-ui): Slint on its software renderer, driven by our
# own Win32 platform (src/shell/platform.rs), so there is no winit, no GPU
# context and no WebView2.
slint = { version = "1.19", default-features = false, features = [
  "std",
  "compat-1-2",
  "renderer-software",
  "software-renderer-systemfonts",
] }
tray-icon = "0.26"
global-hotkey = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
parking_lot = "0.12"
tokio = { version = "1", features = ["sync", "time", "net", "io-util", "process", "rt", "rt-multi-thread", "macros"] }
base64 = "0.22"
rand = "0.8"
regex = "1"
url = "2"
aes-gcm = "0.10"
# Also llm's PKCE (B-039).
sha2 = "0.10"
semver = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
winreg = "0.55"
tauri-winrt-notification = "0.7"
# ---- end ----

# ---- lane: harness ----
# Decodes CapturePreview PNGs for the contrast matrix (B-010).
png = "0.17"
# ---- end ----

# ---- lane: windows ----
raw-window-handle = "0.6"
# ---- end ----

# ---- lane: capture ----
fast_image_resize = "5"
jpeg-decoder = { version = "0.3", default-features = false }
jpeg-encoder = "0.6"
unicode-normalization = "0.1"
# ---- end ----

# ---- lane: llm ----
async-trait = "0.1"
fancy-regex = "0.14"
futures-util = "0.3"
tokio-util = "0.7"
# Native roots and the system proxy: D-19, B-126. The updater shares it.
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "rustls-tls-native-roots",
  "system-proxy",
  "stream",
  "json",
] }
# ---- end ----

# ---- lane: agent ----
# ---- end ----

# ---- lane: voice ----
# Microphone capture over WASAPI, and speech to text on this PC, the free,
# offline default for voice input (entries/voice.md, D-voice-1). transcribe.cpp
# runs Whisper and Parakeet from one library; CPU only, so no Metal or Vulkan.
# It cannot sit beside whisper-rs: each brings its own ggml and the link fails
# (LNK2005). The version is the one Handy ships. It is built with the flags in
# src/voice/whisper.cmake, which reach it through TRANSCRIBE_CMAKE_ARGS
# (tools/voice-cmake-env.mjs); build.rs refuses to build without them.
cpal = "0.15"
transcribe-cpp = { version = "=0.4.2", default-features = false }
# ---- end ----

# Shared Windows bindings: one feature per line, inside the owning lane's
# block. A feature another lane already lists is not repeated.
windows-sys = { version = "0.59", features = [
  # ---- lane: platform ----
  "Win32_Foundation",
  # Rounded corners and the dark frame on the native windows (native-ui).
  "Win32_Graphics_Dwm",
  "Win32_Networking_WinInet",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  # CoTaskMemFree, for the smoke run's AppUserModelID read-back.
  "Win32_System_Com",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  # ---- end ----
  # ---- lane: harness ----
  # ---- end ----
  # ---- lane: windows ----
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  # ---- end ----
  # ---- lane: capture ----
  # The SDR white level of an HDR output (B-109).
  "Win32_Devices_Display",
  "Win32_Graphics_Gdi",
  # ---- end ----
  # ---- lane: llm ----
  # ---- end ----
  # ---- lane: agent ----
  # The in-process desktop engine (src/desktop/host): window frames, the
  # secure-desktop check, SAFEARRAY release, and the input watch's tick.
  "Win32_Graphics_Dwm",
  "Win32_System_Ole",
  "Win32_System_StationsAndDesktops",
  "Win32_System_SystemInformation",
  # ---- end ----
  # ---- lane: voice ----
  # The clipboard paste with save and restore, and the push-to-talk hook.
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  # ---- end ----
] }

windows = { version = "0.62", features = [
  # ---- lane: platform ----
  # ---- end ----
  # ---- lane: harness ----
  # SendInput for Cx::input (B-009).
  "Win32_UI_Input_KeyboardAndMouse",
  # ---- end ----
  # ---- lane: windows ----
  # UISettings.TextScaleFactor (B-022).
  "Foundation",
  "UI_ViewManagement",
  # ---- end ----
  # ---- lane: capture ----
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Registry",
  # Also windows' UiaRaiseNotificationEvent (B-023).
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
  # ---- end ----
  # ---- lane: llm ----
  # WinHttpGetIEProxyConfigForCurrentUser, the proxy fallback (B-126).
  "Win32_Networking_WinHttp",
  # ---- end ----
  # ---- lane: agent ----
  # The in-process desktop engine (src/desktop/host): UI Automation through
  # COM and VARIANTs, and Windows.Media.Ocr over a SoftwareBitmap.
  "Foundation_Collections",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage_Streams",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_Threading",
  "Win32_System_Variant",
  # ---- end ----
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "unwind"
strip = true

# capture: BGRA resizing is the backdrop's hot loop (B-030).
[profile.release.package.fast_image_resize]
opt-level = 3
