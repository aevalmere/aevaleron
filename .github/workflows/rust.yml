# The native Rust app (branches rust-rewrite, rust/**). Every gate runs here:
# no Rust toolchain is installed on a developer machine for this project.
# cargo builds the exe, makensis packs it with src-tauri/installer.nsi (no
# tauri-bundler, no WebView2), and tools/native-install-check.ps1 installs,
# measures, upgrades and uninstalls it on this runner. Every gate runs after
# a failed one, so one run reports everything. Results, pass or fail, land on
# the ci-logs branch under <ref>/<sha>/rust/, metrics included; wait for them
# with `node tools/ci-wait.mjs <sha>` rather than the GitHub API.
name: rust

on:
  push:
    branches: [rust-rewrite, "rust/**"]
  workflow_dispatch:

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 75
    permissions:
      contents: write
      # gh run list / download of the previous installer (the upgrade check).
      actions: read
    defaults:
      run:
        shell: pwsh
        working-directory: src-tauri
    steps:
      - id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - id: node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Rust toolchain
        id: toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version
          cargo --version

      # transcribe.cpp (speech to text) is built with src/voice/whisper.cmake:
      # the static C++ runtime, AVX2, no AVX-512. The file reaches its CMake
      # build through TRANSCRIBE_CMAKE_ARGS, set here for every cargo step
      # below; src-tauri/build.rs stops a build that lacks it.
      - name: Voice build flags
        id: voiceflags
        run: node ../tools/voice-cmake-env.mjs

      # That variable's value never changes, so cargo cannot see an edit to
      # whisper.cmake and would keep a cached transcribe-cpp-sys built with
      # the old flags (D-voice-15 shipped /Od that way). The file's hash is
      # part of the key and of the restore prefix, so a change to it starts
      # from a clean target once.
      - name: Cache cargo
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/src/voice/whisper.cmake') }}-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/src/voice/whisper.cmake') }}-

      # Each gate tees its output to $RUNNER_TEMP/ci-logs/<title>.log for the
      # ci-logs branch, and repeats the end of it as an annotation.
      - name: Gate helper
        id: helper
        run: |
          New-Item -ItemType Directory -Force (Join-Path $env:RUNNER_TEMP 'ci-logs') | Out-Null
          @'
          param([string]$Title, [string]$Command)
          $out = Join-Path $env:RUNNER_TEMP "ci-logs\$Title.log"
          cmd /c "$Command 2>&1" | Tee-Object -FilePath $out
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # An annotation holds 4096 characters and a step keeps 10 errors,
            # so the last ~36 KB goes out in up to nine pieces, in order.
            $tail = ((Get-Content $out -Tail 600) -join "`n").Replace("`r", '')
            $size = 4000
            $start = [Math]::Max(0, $tail.Length - 9 * $size)
            $n = [Math]::Ceiling(($tail.Length - $start) / $size)
            for ($i = 0; $i -lt $n; $i++) {
              $c = $tail.Substring($start + $i * $size, [Math]::Min($size, $tail.Length - $start - $i * $size))
              $enc = $c.Replace('%', '%25').Replace("`n", '%0A')
              Write-Output "::error title=$Title $($i + 1) of $n::$enc"
            }
            exit $code
          }
          '@ | Set-Content (Join-Path $env:RUNNER_TEMP 'gate.ps1')
          # Waits for the app like WaitForExit, polling its child processes
          # every second. The desktop engine runs in process, so the old
          # helper (powershell.exe -Command -) or any child not listed here
          # fails the step. Answers whether the app exited in time.
          @'
          param($Proc, [int]$Ms, [string]$Report)
          $allowed = @('notepad.exe', 'powershell.exe', 'conhost.exe', 'aevaleron.exe', 'cmd.exe', 'werfault.exe', 'explorer.exe')
          $seen = [ordered]@{}
          $bad = New-Object System.Collections.Generic.List[string]
          $end = (Get-Date).AddMilliseconds($Ms)
          while (-not $Proc.HasExited -and (Get-Date) -lt $end) {
            foreach ($c in @(Get-CimInstance Win32_Process -Filter "ParentProcessId=$($Proc.Id)" -ErrorAction SilentlyContinue)) {
              $key = "$($c.ProcessId)"
              if ($seen.Contains($key)) { continue }
              $line = "$($c.Name) [$($c.ProcessId)] $($c.CommandLine)"
              $seen[$key] = $line
              $name = "$($c.Name)".ToLower()
              $helper = $name -eq 'powershell.exe' -and "$($c.CommandLine)" -match '-Command\s+-(\s|$)'
              if ($helper -or $allowed -notcontains $name) { $bad.Add($line) }
            }
            Start-Sleep -Milliseconds 1000
          }
          @('children seen:') + @($seen.Values) + @('unexpected:') + @($bad) | Set-Content $Report
          foreach ($b in $bad) { Write-Host "::error title=unexpected child process::$($b.Replace('%', '%25'))" }
          $Proc.HasExited
          '@ | Set-Content (Join-Path $env:RUNNER_TEMP 'children.ps1')

      - name: Format
        id: fmt
        run: '& "$env:RUNNER_TEMP\gate.ps1" fmt "cargo fmt --all -- --check"'

      # With no local toolchain, a failed fmt gate hands back its fix: the
      # rustfmt patch, as ci-logs/<ref>/<sha>/rust/fmt.patch and gzipped and
      # base64'd across warning annotations (`fmtpatch i of n`), to be applied
      # with `git apply`.
      - name: Format patch
        id: fmtpatch
        if: failure()
        run: |
          cargo fmt --all
          git diff --output="$env:RUNNER_TEMP\ci-logs\fmt.patch"
          $bytes = [IO.File]::ReadAllBytes("$env:RUNNER_TEMP\ci-logs\fmt.patch")
          $ms = New-Object IO.MemoryStream
          $gz = New-Object IO.Compression.GZipStream($ms, [IO.Compression.CompressionMode]::Compress)
          $gz.Write($bytes, 0, $bytes.Length)
          $gz.Close()
          $b64 = [Convert]::ToBase64String($ms.ToArray())
          $size = 4000
          $n = [Math]::Ceiling($b64.Length / $size)
          for ($i = 0; $i -lt $n; $i++) {
            $c = $b64.Substring($i * $size, [Math]::Min($size, $b64.Length - $i * $size))
            Write-Output "::warning title=fmtpatch $($i + 1) of $n::$c"
          }
          git checkout -- .

      - name: Clippy
        id: clippy
        if: success() || failure()
        run: '& "$env:RUNNER_TEMP\gate.ps1" clippy "cargo clippy --all-targets --color never -- -D warnings"'

      - name: Unit tests
        id: test
        if: success() || failure()
        run: '& "$env:RUNNER_TEMP\gate.ps1" test "cargo test --color never"'

      # cargo's bin is target\release\aevaleron.exe (the package name); the
      # installer names it Aevaleron.exe. Nothing ships beside it: the
      # desktop helper runs in process.
      - name: Release build
        id: build
        if: success() || failure()
        run: |
          & "$env:RUNNER_TEMP\gate.ps1" build "cargo build --release --color never"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Get-Item target\release\aevaleron.exe
          "[METRIC] exeKB=$([Math]::Round($exe.Length / 1KB))" | Tee-Object -Append -FilePath "$env:RUNNER_TEMP\ci-logs\build.log"

      # makensis comes from the pinned NSIS 3.13 toolset tools/seed-nsis.ps1
      # lays out (cached; SourceForge, else the runner's own NSIS), the same
      # one the Tauri bundler used, so the build downloads nothing from the
      # github.com release assets that answer 504 for days at a time.
      - name: Restore NSIS toolset
        id: nsiscache
        if: success() || failure()
        uses: actions/cache/restore@v4
        with:
          path: ~/AppData/Local/tauri/NSIS
          key: tauri-nsis-${{ runner.os }}-2.12.4-${{ hashFiles('tools/seed-nsis.ps1', 'tools/nsis/*') }}

      - name: Seed NSIS toolset
        id: nsis
        if: success() || failure()
        run: '& "$env:RUNNER_TEMP\gate.ps1" nsis "pwsh -NoProfile -File ../tools/seed-nsis.ps1"'

      - name: Save NSIS toolset
        id: nsissave
        if: (success() || failure()) && steps.nsis.outcome == 'success' && steps.nsiscache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/AppData/Local/tauri/NSIS
          key: ${{ steps.nsiscache.outputs.cache-primary-key }}

      # The version is package.json's (the updater compares it, release.yml
      # checks the tag against it); Cargo.toml has to agree. The name keeps
      # the Tauri pattern, Aevaleron_<version>_x64-setup.exe.
      - name: Build installer
        id: installer
        if: success() || failure()
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'ci-logs\installer.log'
          $v = node -p "require('../package.json').version"
          $cargo = [regex]::Match((Get-Content Cargo.toml -Raw), '(?m)^version = "([^"]+)"').Groups[1].Value
          if ($cargo -ne $v) { "Cargo.toml says $cargo, package.json says $v" | Set-Content $log; Write-Output "::error title=Build installer::Cargo.toml $cargo != package.json $v"; exit 1 }
          $four = ($v -replace '[-+].*$', '') + '.0'
          $dir = 'target\release\bundle\nsis'
          if (Test-Path $dir) { Remove-Item -Recurse -Force $dir }
          New-Item -ItemType Directory -Force $dir | Out-Null
          $makensis = Join-Path $env:LOCALAPPDATA 'tauri\NSIS\makensis.exe'
          & "$env:RUNNER_TEMP\gate.ps1" installer "`"$makensis`" /V3 /DVERSION=$v /DVERSIONWITHBUILD=$four installer.nsi"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setup = Get-Item "$dir\Aevaleron_${v}_x64-setup.exe"
          "[METRIC] installerKB=$([Math]::Round($setup.Length / 1KB))" | Tee-Object -Append -FilePath $log
          "APP_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "APP_INSTALLER=$($setup.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # The smoke run (src-tauri/src/selftest): every lane's probe inside the
      # built exe. tools/smoke-gate.mjs fails it on any =FAIL line, on a
      # missing "[SMOKE] done", and on any label listed in
      # tools/smoke-labels/*.txt that never printed; it checks itself first.
      - name: Smoke
        id: smoke
        if: success() || failure()
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'ci-logs\smoke.log'
          $exe = 'target\release\aevaleron.exe'
          if (-not (Test-Path $exe)) { "missing $exe" | Set-Content $log; throw "missing $exe" }
          node ../tools/smoke-gate.mjs --self-test 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { Write-Output '::error::the smoke gate failed its own self-test'; exit 1 }
          $scratch = Join-Path $env:RUNNER_TEMP 'aeval-smoke'
          New-Item -ItemType Directory -Force $scratch | Out-Null
          $env:AEVAL_SMOKE = '1'
          $env:AEVAL_USERDATA = $scratch
          $out = Join-Path $env:RUNNER_TEMP 'smoke.out'
          $err = Join-Path $env:RUNNER_TEMP 'smoke.err'
          $p = Start-Process $exe -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
          $null = $p.Handle # keeps ExitCode readable once the process is gone
          $kids = Join-Path $env:RUNNER_TEMP 'ci-logs\smoke-children.log'
          $timedOut = -not (& "$env:RUNNER_TEMP\children.ps1" $p 360000 $kids)
          if ($timedOut) { $p.Kill(); Write-Output '::error::smoke timed out after 360 s' }
          $p.WaitForExit()
          $code = if ($timedOut) { 'timeout' } else { $p.ExitCode }
          @(Get-Content $out -ErrorAction SilentlyContinue) + @('--- stderr ---') + @(Get-Content $err -ErrorAction SilentlyContinue) + @("--- exit code: $code") | Add-Content $log
          $gate = @(node ../tools/smoke-gate.mjs $out 2>&1)
          $gateCode = $LASTEXITCODE
          $gate | Add-Content $log
          $gate
          foreach ($b in @($gate | Where-Object { $_ -match '^\[GATE\] (fail|missing|verdict=FAIL)' } | Select-Object -First 9)) {
            Write-Output "::error title=smoke gate::$($b.Replace('%', '%25'))"
          }
          # Every [SMOKE] line as annotations, readable without a token (a
          # panic in host::setup or a hook shows in the stderr tail).
          $text = (Get-Content $out -Raw -ErrorAction SilentlyContinue) + ''
          # Select-Object has no -SkipWhile: the lines after 'unexpected:'.
          $kidLines = @(Get-Content $kids -ErrorAction SilentlyContinue)
          $cut = [Array]::IndexOf($kidLines, 'unexpected:')
          $strays = if ($cut -ge 0) { @($kidLines | Select-Object -Skip ($cut + 1)) } else { @('no child report') }
          $ok = -not $timedOut -and $code -eq 0 -and $gateCode -eq 0 -and $strays.Count -eq 0
          $lines = ($text -split "`n" | Where-Object { $_ -match '^\[SMOKE\]' }) -join "`n"
          if (-not $ok) { $lines += "`n--- stderr ---`n" + ((Get-Content $err -Tail 40 -ErrorAction SilentlyContinue) -join "`n") }
          $lines = $lines.Replace("`r", '')
          $level = if ($ok) { 'notice' } else { 'error' }
          $n = [Math]::Min(9, [Math]::Ceiling([Math]::Max(1, $lines.Length) / 4000))
          for ($i = 0; $i -lt $n; $i++) {
            $c = $lines.Substring([Math]::Min($lines.Length, $i * 4000), [Math]::Max(0, [Math]::Min(4000, $lines.Length - $i * 4000)))
            Write-Output "::$level title=smoke $($i + 1) of $n::$($c.Replace('%', '%25').Replace("`n", '%0A'))"
          }
          Get-Content $kids -ErrorAction SilentlyContinue | Add-Content $log
          if (-not $ok) { Add-Content $log "smoke failed: exit code $code, gate exit code $gateCode, unexpected children $($strays.Count)"; exit 1 }

      # Split (c): capture fidelity and exclusion on the runner's real screen,
      # then the desktop selfcheck (Notepad included).
      - name: Capture check
        id: capture
        if: success() || failure()
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'ci-logs\capture.log'
          $exe = 'target\release\aevaleron.exe'
          if (-not (Test-Path $exe)) { "missing $exe" | Set-Content $log; throw "missing $exe" }
          $scratch = Join-Path $env:RUNNER_TEMP 'aeval-capture'
          New-Item -ItemType Directory -Force $scratch | Out-Null
          $env:AEVAL_CAPTURE_CHECK = '1'
          $env:AEVAL_USERDATA = $scratch
          $out = Join-Path $env:RUNNER_TEMP 'capture.out'
          $errFile = Join-Path $env:RUNNER_TEMP 'capture.err'
          $p = Start-Process $exe -PassThru -RedirectStandardOutput $out -RedirectStandardError $errFile
          $timedOut = -not $p.WaitForExit(180000)
          if ($timedOut) { $p.Kill(); Write-Output '::error::capture check timed out' }
          $text = (Get-Content $out -Raw -ErrorAction SilentlyContinue) + ''
          $errText = (Get-Content $errFile -Tail 40 -ErrorAction SilentlyContinue) -join "`n"
          Write-Output $text $errText
          # stdout and the whole of stderr, for the ci-logs branch.
          @($text, '--- stderr ---') + @(Get-Content $errFile -ErrorAction SilentlyContinue) | Set-Content $log
          if ($timedOut) { Add-Content $log 'capture check timed out after 180 s' }
          $ok = $text -match '\[CAPTURE\] done'
          $lines = ($text -split "`n" | Where-Object { $_ -match '^\[CAPTURE\]' }) -join "`n"
          if (-not $ok) { $lines += "`n--- stderr ---`n" + $errText }
          # 4096 characters per annotation, 10 per level per step.
          $lines = $lines.Replace("`r", '')
          $level = if ($ok) { 'notice' } else { 'error' }
          $n = [Math]::Min(9, [Math]::Ceiling([Math]::Max(1, $lines.Length) / 4000))
          for ($i = 0; $i -lt $n; $i++) {
            $c = $lines.Substring([Math]::Min($lines.Length, $i * 4000), [Math]::Max(0, [Math]::Min(4000, $lines.Length - $i * 4000)))
            Write-Output "::$level title=capture check $($i + 1) of $n::$($c.Replace('%', '%25').Replace("`n", '%0A'))"
          }
          if (-not $ok) { Add-Content $log 'capture check failed: no "[CAPTURE] done" line'; exit 1 }

      - name: Desktop selfcheck
        id: desktop
        if: success() || failure()
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'ci-logs\desktop.log'
          $exe = 'target\release\aevaleron.exe'
          if (-not (Test-Path $exe)) { "missing $exe" | Set-Content $log; throw "missing $exe" }
          $scratch = Join-Path $env:RUNNER_TEMP 'aeval-desktop'
          New-Item -ItemType Directory -Force $scratch | Out-Null
          $env:AEVAL_DESKTOP_CHECK = '1'
          $env:AEVAL_USERDATA = $scratch
          $out = Join-Path $env:RUNNER_TEMP 'desktop.out'
          $errFile = Join-Path $env:RUNNER_TEMP 'desktop.err'
          $p = Start-Process $exe -PassThru -RedirectStandardOutput $out -RedirectStandardError $errFile
          $kids = Join-Path $env:RUNNER_TEMP 'ci-logs\desktop-children.log'
          $timedOut = -not (& "$env:RUNNER_TEMP\children.ps1" $p 240000 $kids)
          if ($timedOut) { $p.Kill(); Write-Output '::error::desktop selfcheck timed out' }
          $text = (Get-Content $out -Raw -ErrorAction SilentlyContinue) + ''
          $errText = (Get-Content $errFile -Tail 40 -ErrorAction SilentlyContinue) -join "`n"
          Write-Output $text $errText
          # stdout and the whole of stderr, for the ci-logs branch.
          @($text, '--- stderr ---') + @(Get-Content $errFile -ErrorAction SilentlyContinue) | Set-Content $log
          if ($timedOut) { Add-Content $log 'desktop selfcheck timed out after 240 s' }
          # Select-Object has no -SkipWhile: the lines after 'unexpected:'.
          $kidLines = @(Get-Content $kids -ErrorAction SilentlyContinue)
          $cut = [Array]::IndexOf($kidLines, 'unexpected:')
          $strays = if ($cut -ge 0) { @($kidLines | Select-Object -Skip ($cut + 1)) } else { @('no child report') }
          $ok = $text -match '\[DESKTOP\] done' -and $strays.Count -eq 0
          $lines = ($text -split "`n" | Where-Object { $_ -match '^\[DESKTOP\]' -and $_ -notmatch 'typeReadText|editorCandidates' }) -join "`n"
          if (-not $ok) { $lines += "`n--- stderr ---`n" + $errText }
          # 4096 characters per annotation, 10 per level per step.
          $lines = $lines.Replace("`r", '')
          $level = if ($ok) { 'notice' } else { 'error' }
          $n = [Math]::Min(9, [Math]::Ceiling([Math]::Max(1, $lines.Length) / 4000))
          for ($i = 0; $i -lt $n; $i++) {
            $c = $lines.Substring([Math]::Min($lines.Length, $i * 4000), [Math]::Max(0, [Math]::Min(4000, $lines.Length - $i * 4000)))
            Write-Output "::$level title=desktop selfcheck $($i + 1) of $n::$($c.Replace('%', '%25').Replace("`n", '%0A'))"
          }
          Get-Content $kids -ErrorAction SilentlyContinue | Add-Content $log
          if (-not $ok) { Add-Content $log "desktop selfcheck failed: [DESKTOP] done seen=$($text -match '\[DESKTOP\] done'), unexpected children $($strays.Count)"; exit 1 }

      # The installer on this runner: files, shortcuts, the uninstall entry,
      # one process and no WebView2, idle memory and CPU, single instance, an
      # upgrade over the last green rust/next (Tauri) installer, and an
      # uninstall that keeps %APPDATA%\aevaleron. Its [METRIC] lines go into
      # the ci-logs summary table.
      - name: Install check
        id: install
        if: (success() || failure()) && env.APP_INSTALLER != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'native-install'
          & "$env:RUNNER_TEMP\gate.ps1" install "pwsh -NoProfile -File ..\tools\native-install-check.ps1 -Installer `"$env:APP_INSTALLER`" -Version $env:APP_VERSION -Exe target\release\aevaleron.exe -Out `"$out`" -PreviousBranch rust/next"
          exit $LASTEXITCODE

      # Consumers download the installer under this name (it kept the Tauri
      # era's name on purpose).
      - id: upload
        if: success() || failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aevaleron-tauri-nsis
          path: src-tauri/target/release/bundle/nsis/Aevaleron_*.exe
          if-no-files-found: error

      # The bare exe and its helper, for ui-shots.yml (it shoots this build
      # instead of compiling again).
      - id: uploadexe
        if: success() || failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aevaleron-native-exe
          retention-days: 7
          path: |
            src-tauri/target/release/aevaleron.exe
            src-tauri/target/release/desktop/
          if-no-files-found: error

      # Last, pass, fail or cancel: summary.md (with the [METRIC] table),
      # errors.txt and every gate's log to ci-logs/<ref>/<sha>/rust/
      # (tools/ci-publish.mjs). A failure to publish never turns a green run
      # red.
      - name: Publish to ci-logs
        if: always()
        continue-on-error: true
        working-directory: .
        env:
          CI_WORKFLOW: rust
          CI_STATUS: ${{ job.status }}
          CI_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_STEPS: |
            Checkout|${{ steps.checkout.outcome }}
            Node|${{ steps.node.outcome }}
            Rust toolchain|${{ steps.toolchain.outcome }}
            Voice build flags|${{ steps.voiceflags.outcome }}
            Cache cargo|${{ steps.cache.outcome }}
            Gate helper|${{ steps.helper.outcome }}
            Format|${{ steps.fmt.outcome }}|fmt.log
            Format patch|${{ steps.fmtpatch.outcome }}|fmt.patch
            Clippy|${{ steps.clippy.outcome }}|clippy.log
            Unit tests|${{ steps.test.outcome }}|test.log
            Release build|${{ steps.build.outcome }}|build.log
            Restore NSIS toolset|${{ steps.nsiscache.outcome }}
            Seed NSIS toolset|${{ steps.nsis.outcome }}|nsis.log
            Save NSIS toolset|${{ steps.nsissave.outcome }}
            Build installer|${{ steps.installer.outcome }}|installer.log
            Smoke|${{ steps.smoke.outcome }}|smoke.log
            Capture check|${{ steps.capture.outcome }}|capture.log
            Desktop selfcheck|${{ steps.desktop.outcome }}|desktop.log
            Install check|${{ steps.install.outcome }}|install.log
            Upload installer|${{ steps.upload.outcome }}
            Upload exe|${{ steps.uploadexe.outcome }}
        run: node tools/ci-publish.mjs

  # The native screenshots of this build (ui-shots.yml), from the exe the
  # build job uploaded: no second compile. rust/native-ui only.
  shots:
    needs: build
    if: always() && github.ref == 'refs/heads/rust/native-ui' && needs.build.result != 'cancelled'
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/ui-shots.yml
    secrets: inherit
