<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src ipc: http://ipc.localhost" />
  <title>Aevaleron agents</title>
  <link rel="stylesheet" href="agents.css" />
</head>
<body>
  <!-- The agents notification (src-tauri/src/agents): drops from the top of
       the screen when a coding agent finishes or needs you, drawn to look
       like Aevalsistant's (its src/Toast.cs). The head is the session that
       just changed; under it, every other session with its state. A click
       goes to that agent's window, a right click puts it away. The window
       never takes the keyboard, so nothing here needs focus: Alt+Tab is the
       keyboard's way in. -->
  <div id="card" role="status" aria-live="polite" hidden>
    <div id="head">
      <span id="avatar" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="30" height="30">
          <ellipse class="face" cx="16" cy="17" rx="13" ry="12" />
          <path class="hair" d="M2.2 20C1 9 9 2.5 16 3C24 2.5 31 9 29.8 20L26 14L22 17L19 12.5L15 16.5L11 12.5L7.5 16.5Z" />
          <ellipse class="clip" cx="19.5" cy="7.1" rx="3" ry="1.6" />
          <path class="eye" d="M14.35 20.68A2.5 2 0 0 1 9.65 20.68M22.35 20.68A2.5 2 0 0 1 17.65 20.68" />
        </svg>
      </span>
      <span id="state" aria-hidden="true"></span>
      <div id="text">
        <div id="line"><span id="title"></span><span id="place"></span></div>
        <div id="detail"><p id="d1"></p><p id="dn" aria-hidden="true"></p></div>
      </div>
      <span id="keys" hidden><kbd>Alt</kbd><kbd>Tab</kbd></span>
    </div>
    <ul id="list" hidden></ul>
  </div>
  <script src="agents.js"></script>
</body>
</html>
