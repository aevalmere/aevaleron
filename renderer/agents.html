<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: http://aeval-frame.localhost aeval-frame:; connect-src ipc: http://ipc.localhost http://aeval-frame.localhost aeval-frame:" />
  <title>Aevaleron agents</title>
  <link rel="stylesheet" href="glass.css" />
  <link rel="stylesheet" href="agents.css" />
</head>
<body>
  <!-- The agents notification (src-tauri/src/agents): Aevaleron's glass,
       dropping from the top of the screen where Aevalsistant puts its own,
       and behaving like it (its src/Toast.cs). The head is the session that
       just changed; under it, every session with what it started nested
       under it, each with its own state and time. A click goes to that
       agent's window, a right click puts it away. The window never takes
       the keyboard, so nothing here needs focus: Alt+Tab is the keyboard's
       way in. -->
  <div id="card" class="glass thin" role="status" aria-live="polite" hidden>
    <div id="head">
      <span id="state" aria-hidden="true"></span>
      <div id="line"><span id="title"></span><span id="place"></span></div>
      <div id="detail"><p id="d1"></p><p id="dn" aria-hidden="true"></p></div>
      <span id="keys" hidden><kbd>Alt</kbd><kbd>Tab</kbd></span>
    </div>
    <ul id="list" hidden></ul>
  </div>
  <script src="glass.js"></script>
  <script src="agents.js"></script>
</body>
</html>
